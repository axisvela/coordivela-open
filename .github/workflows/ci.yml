name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: GOWORK=off go test ./...
        working-directory: sdk/go
      - run: GOWORK=off go vet ./...
        working-directory: sdk/go
      - run: GOWORK=off go test ./...
        working-directory: examples/runtime-adapter
